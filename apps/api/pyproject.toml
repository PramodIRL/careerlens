[project]
name = "careerlens-api"
version = "0.1.0"
description = "CareerLens API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "python-multipart>=0.0.32",
    "celery[redis]>=5.6.3",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    # Async HTTP client for the public GitHub REST API (Prompt 3.1).
    # Chosen over `requests` (sync — would block the event loop in an
    # otherwise fully-async app) and `aiohttp` (a whole new dependency
    # tree) for two concrete reasons: first-class per-phase timeout
    # control, and a pluggable transport (`httpx.MockTransport`) that
    # lets the client's timeout/rate-limit/error handling be tested
    # without ever reaching the network. Already present in the lock
    # file as a test dependency (Starlette's TestClient uses it), so
    # this promotion adds no new transitive packages.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

# celery ships no py.typed marker / stubs — mypy would otherwise treat
# every import from it as an error (not just Any). This is the standard
# way to say "trust this untyped third-party library", scoped to just
# celery rather than loosening strict mode project-wide.
[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true
